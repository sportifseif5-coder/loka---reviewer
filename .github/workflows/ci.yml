name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Format check
        run: make fmt

      - name: Vet
        run: make vet

      - name: Build core
        run: go build ./...

      - name: Unit tests
        run: go test ./... -count=1

      - name: Offline tests (network disabled)
        run: ./scripts/test-offline.sh

      - name: Golden files are current
        run: go test ./internal/review/ -run TestGolden -count=1

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Vet desktop shell
        run: go vet -tags desktop ./desktop/

      - name: Build desktop shell
        run: go build -tags desktop -o /tmp/loka ./desktop/
